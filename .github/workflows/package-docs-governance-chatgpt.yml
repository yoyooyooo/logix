name: Package docs-governance skill

on:
  pull_request:
    branches:
      - main
    paths:
      - '.chatgpt-artifacts/build_docs_governance.py'
      - '.github/workflows/package-docs-governance-chatgpt.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build and validate skill
        run: python .chatgpt-artifacts/build_docs_governance.py

      - name: Prepare publish tree
        run: |
          rm -rf .chatgpt-artifacts/publish
          mkdir -p .chatgpt-artifacts/publish
          cp -R .chatgpt-artifacts/out/docs-governance .chatgpt-artifacts/publish/docs-governance

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: docs-governance-upgraded
          path: .chatgpt-artifacts/publish
          if-no-files-found: error
          retention-days: 7
